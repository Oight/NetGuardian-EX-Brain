name: Foundation checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standard-runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: code/.node-version
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci --ignore-scripts --cache .cache/npm
      - run: npm run check
      - run: npm run check:clean
      - name: Prepare verified Electron binary (Windows)
        if: runner.os == 'Windows'
        run: npm run prepare:electron
      - name: Real production Electron acceptance (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron
  design:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design_document
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B scripts/design/verify_subsystem_designs.py
      - run: python -B scripts/design/verify_development_docs.py
